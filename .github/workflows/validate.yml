name: Validar RickySafe

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rickysafe_test
          POSTGRES_USER: rickysafe_test
          POSTGRES_PASSWORD: rickysafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rickysafe_test -d rickysafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rickysafe_test
      DB_USER: rickysafe_test
      DB_PASSWORD: rickysafe_test
      JWT_SECRET: ci-test-secret-not-used-in-production-000000
      TEST_DATABASE_URL: postgresql://rickysafe_test:rickysafe_test@localhost:5432/rickysafe_test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar backend
        working-directory: backend
        run: npm ci

      - name: Preparar base temporal
        working-directory: backend
        run: npm run migrate

      - name: Probar flujos de API y permisos
        working-directory: backend
        run: npm test

      - name: Validar sintaxis backend
        working-directory: backend
        run: npm run check

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: npm run build
